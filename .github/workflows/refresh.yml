name: Refresh dashboard data

on:
  schedule:
    # 20:00 UTC is 6:00am in Brisbane. Queensland has no daylight saving, so this
    # stays correct all year.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull from Employment Hero and rebuild data.json
        env:
          EH_CLIENT_ID: ${{ secrets.EH_CLIENT_ID }}
          EH_CLIENT_SECRET: ${{ secrets.EH_CLIENT_SECRET }}
          EH_REFRESH_TOKEN: ${{ secrets.EH_REFRESH_TOKEN }}
          EH_ORG_ID_AU: ${{ secrets.EH_ORG_ID_AU }}
          EH_ORG_ID_UK: ${{ secrets.EH_ORG_ID_UK }}
        run: node scripts/refresh.mjs

      - name: Commit if the figures changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change to data.json, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Dashboard refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
