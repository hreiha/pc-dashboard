name: Refresh dashboard data

on:
  schedule:
    # 20:00 UTC is 6:00am in Brisbane. Queensland has no daylight saving, so this
    # stays correct all year.
    - cron: "0 20 * * *"

  # Rebuild as soon as the Recruitment Forecast flow commits new figures, rather than
  # leaving them unused until the next morning. Limited to that one file, so the commit
  # this workflow makes to data.json does not set it off again.
  push:
    branches: [main]
    paths:
      - recruitment.json

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Pull from Employment Hero and rebuild data.json
        env:
          EH_CLIENT_ID: ${{ secrets.EH_CLIENT_ID }}
          EH_CLIENT_SECRET: ${{ secrets.EH_CLIENT_SECRET }}
          EH_REFRESH_TOKEN: ${{ secrets.EH_REFRESH_TOKEN }}
          EH_ORG_ID_AU: ${{ secrets.EH_ORG_ID_AU }}
          EH_ORG_ID_UK: ${{ secrets.EH_ORG_ID_UK }}
        run: node scripts/refresh.mjs

      - name: Commit if the figures changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change to data.json, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data.json is generated output, so there is never anything to merge: the newest
          # run wins. Reset to the remote and reapply, which cannot conflict the way a
          # rebase does when the recruitment flow commits while this is running.
          cp data.json /tmp/data.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json data.json

            if git diff --quiet -- data.json; then
              echo "Remote already has these figures, nothing to commit."
              exit 0
            fi

            git add data.json
            git commit -m "Dashboard refresh $(date -u '+%Y-%m-%d %H:%M') UTC"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected, someone else committed. Retrying."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
